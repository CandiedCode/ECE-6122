---
name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-build
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc
          vcvarsall: false
          cmake: "3.27.1"
          ninja: true
          vcpkg: true
      - name: Install X11, SFML, OpenGL, GLFW, GLEW, Assimp and OpenMP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libfreetype6-dev \
            libomp-dev \
            libglfw3-dev \
            libglew-dev \
            libassimp-dev
      - name: Create build directory
        run: mkdir -p build
      - name: Run CMake
        env:
          USE_EXTERNAL_LIBS: "OFF"
        run: cd build && cmake ..
      - name: Build with CMake
        run: cd build && cmake --build . --config Release
      - name: Run cpplint
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '21'
          style: 'file'
          tidy-checks: ''
          ignore: 'build'
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' }}
          files-changed-only: true
