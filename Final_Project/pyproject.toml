[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-personal-assistant"
version = "0.1.0"
description = "A personal assistant using the Reachy robot - Final project for ECE-6122 Advanced Programming"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Jennifer Wagenberg", email = "jcwagenberg@gatech.edu"}
]
keywords = ["reachy", "robot", "assistant", "mujoco"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "reachy-mini[mujoco]",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/CandiedCode/ECE-6122 "
Documentation = "https://github.com/CandiedCode/ECE-6122 "
Repository = "https://github.com/CandiedCode/ECE-6122 "
